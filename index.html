<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PvB DPS Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eaf9f0;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: #2b8a3e;
    }
    label {
      font-weight: bold;
      margin-top: 15px;
      display: block;
    }
    select, input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      margin-top: 20px;
      width: 100%;
      background-color: #2b8a3e;
      color: white;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background-color: #226b30;
    }
    .result {
      margin-top: 25px;
      font-size: 18px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌿 Plants vs Brainrots DPS Calculator</h1>

    <label for="plant">Select Plant:</label>
    <select id="plant">
      <option value="10">Cactus</option>
      <option value="25">Strawberry</option>
      <option value="55">Pumpkin</option>
      <option value="115">Sunflower</option>
      <option value="250">Dragon Fruit</option>
      <option value="500">Eggplant</option>
      <option value="750">Watermelon</option>
      <option value="1750">Grape</option>
      <option value="2200">Cocotank</option>
      <option value="2250">Carnivorous Plant</option>
      <option value="3500">Mr Carrot</option>
      <option value="4500">Tomatiro</option>
      <option value="12500">Shroombino</option>
      <option value="12500">King Limone</option>
      <option value="20000">Mango</option>
    </select>

    <label for="currentLevel">Current Level (L):</label>
    <input type="number" id="currentLevel" min="0" value="0" />

    <label for="weight">Weight (K) in kg:</label>
    <input type="number" id="weight" min="0" step="0.1" value="1" />

    <label for="wantedLevel">Desired Level (W):</label>
    <input type="number" id="wantedLevel" min="0" value="0" />

    <button onclick="calculate()">Calculate DPS</button>

    <div class="result" id="result"></div>
  </div>

  <script>
    function calculate() {
      const P = parseFloat(document.getElementById("plant").value);
      const L = parseFloat(document.getElementById("currentLevel").value);
      const K = parseFloat(document.getElementById("weight").value);
      const W = parseFloat(document.getElementById("wantedLevel").value);
      const resultBox = document.getElementById("result");

      if (isNaN(P) || isNaN(L) || isNaN(K) || isNaN(W)) {
        resultBox.textContent = "❌ Please enter valid numbers in all fields.";
        return;
      }

      const dps = P * K * Math.pow(1.48, W);
      let output = `🌟 DPS at level ${W}: ${dps.toFixed(2)}`;

      if (L > W) {
        const extra = L / Math.pow(1.48, L);
        output += `<br>📉 L > W: L / 1.48^L = ${extra.toFixed(4)}`;
      }

      resultBox.innerHTML = output;
    }
  </script>
</body>
</html>
