<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Plants vs Brainrots DPS Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f8ff;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: #2e8b57;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      margin-top: 20px;
      width: 100%;
      background: #2e8b57;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #276747;
    }
    .result {
      margin-top: 25px;
      font-size: 18px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌱 PvB DPS Calculator</h1>

    <label for="plant">Select Plant:</label>
    <select id="plant">
      <option value="10">Cactus</option>
      <option value="25">Strawberry</option>
      <option value="55">Pumpkin</option>
      <option value="115">Sunflower</option>
      <option value="250">Dragon Fruit</option>
      <option value="500">Eggplant</option>
      <option value="750">Watermelon</option>
      <option value="1750">Grape</option>
      <option value="2200">Cocotank</option>
      <option value="2250">Carnivorous Plant</option>
      <option value="3500">Mr Carrot</option>
      <option value="4500">Tomatiro</option>
      <option value="12500">Shroombino</option>
      <option value="12500">King Limone</option>
      <option value="20000">Mango</option>
    </select>

    <label for="level">Current Level (L):</label>
    <input type="number" id="level" min="0" value="0" />

    <label for="weight">Weight (K) in kg:</label>
    <input type="number" id="weight" min="0" step="0.1" value="1" />

    <label for="wanted">Desired Level (W):</label>
    <input type="number" id="wanted" min="0" value="0" />

    <button onclick="calculateDPS()">Calculate</button>

    <div class="result" id="result"></div>
  </div>

  <script>
    function calculateDPS() {
      const P = parseFloat(document.getElementById("plant").value);
      const L = parseFloat(document.getElementById("level").value);
      const K = parseFloat(document.getElementById("weight").value);
      const W = parseFloat(document.getElementById("wanted").value);
      const resultBox = document.getElementById("result");

      if (isNaN(P) || isNaN(L) || isNaN(K) || isNaN(W)) {
        resultBox.textContent = "❌ Please enter all fields with valid numbers.";
        return;
      }

      // Main DPS formula
      const DPS = P * K * Math.pow(1.48, L);

      let additionalInfo = "";
      if (L > W) {
        const specialValue = L / Math.pow(1.48, L);
        additionalInfo = `<br>📉 Since L > W: L / 1.48^L = ${specialValue.toFixed(4)}`;
      }

      resultBox.innerHTML = `🔥 DPS = ${DPS.toFixed(2)}${additionalInfo}`;
    }
  </script>
</body>
</html>
